<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UBC Grade Calculator</title>
    <meta name="description" content="Track your UBC course grades with real-time calculations" />

    <!--
      Declared explicitly rather than relying on the browser's implicit
      /favicon.ico lookup, which caches hard enough to keep serving a stale icon
      long after the file changes. The ?v= query is the cache buster: bump it
      whenever the icon is replaced.
    -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />

    <meta property="og:title" content="UBC Grade Calculator" />
    <meta property="og:description" content="Track your UBC course grades with real-time calculations" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/favicon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
