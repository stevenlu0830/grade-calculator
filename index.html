<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UBC Grade Calculator</title>
    <meta name="description" content="Track your UBC course grades with real-time calculations" />

    <!--
      Declared explicitly rather than relying on the browser's implicit
      /favicon.ico lookup, which caches hard enough to keep serving a stale icon
      long after the file changes. The ?v= query is the cache buster: bump it
      whenever the icon is replaced.
    -->
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <link rel="apple-touch-icon" href="/favicon.png?v=2" />

    <!--
      The two typefaces tailwind.config.ts names in `fontFamily`. They live here
      rather than as an `@import` in index.css for two reasons: PostCSS drops an
      `@import` that follows the `@tailwind` directives (it must precede every
      other statement), which silently cost the production build its fonts; and
      a link in the HTML is found during the initial parse, instead of after the
      stylesheet has been fetched and parsed. The preconnects open the two
      connections Google Fonts needs — the second is crossorigin because the
      font files themselves are served from a different origin than the CSS.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <meta property="og:title" content="UBC Grade Calculator" />
    <meta property="og:description" content="Track your UBC course grades with real-time calculations" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.png" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/favicon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
